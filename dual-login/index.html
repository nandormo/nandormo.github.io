<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dual Login — user / admin</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1a1a1a;
    line-height: 1.6;
    background: #f5f5f5;
    min-height: 100dvh;
    padding: 2rem 1rem;
  }

  h1 { font-size: 1.5rem; margin: 0 0 .25rem; text-align: center; }
  .lede {
    max-width: 760px;
    margin: 0 auto 2rem;
    text-align: center;
    color: #555;
    font-size: .95rem;
  }

  .panes {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.25rem;
    max-width: 760px;
    margin: 0 auto;
  }
  @media (min-width: 700px) {
    .panes { grid-template-columns: 1fr 1fr; }
  }

  .pane {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 1.5rem;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
  }
  .pane h2 { font-size: 1.1rem; margin: 0 0 1rem; }
  .pane--user h2 { color: #16a34a; }
  .pane--admin h2 { color: #dc2626; }

  .field { margin-bottom: 1rem; }
  label {
    display: block;
    font-size: .85rem;
    font-weight: 600;
    margin-bottom: .3rem;
  }
  input {
    font-family: inherit;
    font-size: 16px;            /* 16px avoids iOS auto-zoom on focus */
    width: 100%;
    padding: .55rem .7rem;
    color: #1a1a1a;
    background: #fff;
    border: 1px solid #c7c7c7;
    border-radius: 6px;
  }
  input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .2);
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    width: 100%;
    padding: .6rem 1rem;
    margin-top: .5rem;
    color: #fff;
    background: #1a1a1a;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #333; }

  .status {
    min-height: 1.4em;
    margin: .6rem 0 0;
    font-size: .85rem;
    color: #666;
  }
</style>
</head>
<body>

<h1>Dual Login</h1>
<p class="lede">Two independent login forms on one page. Both are annotated with
<code>autocomplete</code> so a browser password manager can offer credentials for
each one; the <code>section-*</code> tokens keep the user and admin sets apart.
Submitting does nothing.</p>

<div class="panes">

  <section class="pane pane--user">
    <h2>User login</h2>
    <form id="user-form" action="#" method="post" novalidate>
      <div class="field">
        <label for="user-username">Username</label>
        <input
          type="text"
          id="user-username"
          name="username"
          autocomplete="section-user username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required />
      </div>

      <div class="field">
        <label for="user-password">Password</label>
        <input
          type="password"
          id="user-password"
          name="password"
          autocomplete="section-user current-password"
          required />
      </div>

      <button type="submit">Sign in</button>
      <p class="status" id="user-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="pane pane--admin">
    <h2>Admin login</h2>
    <form id="admin-form" action="#" method="post" novalidate>
      <div class="field">
        <label for="admin-username">Username</label>
        <input
          type="text"
          id="admin-username"
          name="username"
          autocomplete="section-admin username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required />
      </div>

      <div class="field">
        <label for="admin-password">Password</label>
        <input
          type="password"
          id="admin-password"
          name="password"
          autocomplete="section-admin current-password"
          required />
      </div>

      <button type="submit">Sign in</button>
      <p class="status" id="admin-status" role="status" aria-live="polite"></p>
    </form>
  </section>

</div>

<script>
  // No-op submit: just report which form fired, never navigate.
  for (const which of ["user", "admin"]) {
    const form = document.getElementById(which + "-form");
    const status = document.getElementById(which + "-status");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      status.textContent = "Submitted (" + which + ") — no-op.";
    });
  }
</script>

</body>
</html>
